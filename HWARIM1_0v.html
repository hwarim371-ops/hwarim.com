<!DOCTYPE html>
<!--
  HWARIM 1.0.4 (버그픽스)
  - [버그] 의견/투표 이미지 렌더링 깨짐 (핵심 원인 완전 수정)
    → Drive uc?export=view URL은 브라우저 <img> 직접 임베드 차단됨
    → 일반 게시물과 동일하게 drive.google.com/thumbnail?id=...&sz=w1200 API 사용
    → driveImgSrc() 헬퍼 신설: fileId 또는 Drive URL → thumbnail URL 자동 변환
  - [개선] 투표 항목 이미지 최대 높이 160→200px, margin-bottom 추가로 텍스트와 간격 확보
  - [개선] 서브포스트/투표 lightbox 클릭 시 고해상도 thumbnail URL 사용
  HWARIM 1.0.3 (버그픽스)
    → 저장값(Drive URL)과 미리보기값(base64)을 완전 분리 (_voteOptPreviews 맵 신설)
    → 미리보기는 항상 base64 dataURL 사용, Drive URL은 getCloudData 저장 전용
  - [버그] 서브포스트 이미지 미리보기 깨짐: __preview_ 키/맵 방식의 복잡성으로 렌더링 오류
    → 슬롯 객체 배열({ driveUrl, previewDataUrl, uploading })로 전면 재설계
    → 미리보기/저장값 완전 분리, 에러 핸들링 정상화
  - [버그] 에러 핸들러 내 ['indexOf'].forEach() 의미없는 코드 제거
  - [UI] 투표 항목 이미지 썸네일 52×40 → 96×72로 확대
  - [UI] 서브포스트 이미지 썸네일 80×60 → 120×90으로 확대
  - [최적화] clearVoteOptImg/resetVoteOpts에서 _voteOptPreviews 맵 동기 정리
  HWARIM 1.0.2 (버그픽스)
  - [핵심버그] forceSyncAndNotify: push 후 즉시 pull 제거
    → GAS 서버 쓰기 지연으로 이전 데이터 pull → 작성 게시물 삭제되는 버그 수정
  - [버그] syncFromCloud: applyCloudData 후 navigateTo 무조건 호출 제거
    → 집중 뷰(write/survey/detail) 보호 및 불필요한 재렌더링 방지
  - [버그] applySyncUrl: push().then(pull) → pull 우선, 클라우드 비어있을 때만 push
    → URL 최초 연결 시 클라우드 기존 데이터가 로컬 데이터로 덮어씌워지는 버그 수정
  - [버그] addComment: 댓글 time 하드코딩('방금 전') → ISO 타임스탬프로 변경
  - [신규] formatRelativeTime(): ISO 날짜를 상대 시간으로 변환 유틸 추가 (기존 문자열 호환)
  - [최적화] syncFromCloud: 현재 활성 뷰가 집중 뷰면 navigateTo 스킵
  HWARIM 1.0v
  - [신규] 댓글 삭제 기능 (본인/관리자)
  - [신규] 게시글 내 [의견] 버튼 → 추가 게시글 작성 (서브포스트)
  - [신규] 패치노트 관리자 편집 기능
  - [버그] doLogin 강제 syncToCloud 제거 (성능 개선)
  - [버그] 데모 알림 타이머 제거
  - [버그] POSITION_OPTIONS 기본값 수정
  - [버그] renderParticipants 중복 정의 정리
  - [최적화] 불필요한 코드 정리 및 구조 개선
  - 데이터 스키마 버전: 4 (기존 데이터 호환)
-->
